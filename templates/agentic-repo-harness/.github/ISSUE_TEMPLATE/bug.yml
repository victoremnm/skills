name: Bug report
description: Report a reproducible defect.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Provide the smallest reproducible report. Do not include secrets or production data.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, or a minimal fixture. Redact credentials.
